[project]
name = "telegram-agent"
version = "0.1.0"
description = "Personal Uzbek-speaking Telegram voice-call assistant and planner"
requires-python = ">=3.12,<3.13"
dependencies = [
  "py-tgcalls[telethon]>=2.2,<4",
  "openai>=1.100,<4",
  "python-dotenv>=1.0,<2",
  "tzdata>=2025.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.11"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore:'audioop' is deprecated.*:DeprecationWarning"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
